# Target standby on GKE. It streams from hello-src on EKS through the Tailscale
# egress proxy db-eks (infra ADR 0048) and becomes primary when the engine promotes it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: hello-gke, namespace: hello }
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  smartShutdownTimeout: 5
  storage: { size: 1Gi, storageClass: standard-rwo }
  certificates:
    # The EKS side reaches this server as db-gke.hopcharlie-db-network.svc.cluster.local.
    serverAltDNSNames: [db-gke.hopcharlie-db-network.svc.cluster.local]
  bootstrap:
    pg_basebackup: { source: hello-src, database: app, owner: app, secret: { name: hello-src-app } }
  replica: { self: hello-gke, primary: hello-src, source: hello-src }
  externalClusters:
    - name: hello-src
      connectionParameters: { host: db-eks.hopcharlie-db-network.svc.cluster.local, user: streaming_replica, dbname: postgres, sslmode: verify-full }
      sslKey: { name: hello-src-replication, key: tls.key }
      sslCert: { name: hello-src-replication, key: tls.crt }
      sslRootCert: { name: hello-src-ca, key: ca.crt }
    - name: hello-gke
      connectionParameters: { host: hello-gke-rw.hello.svc, user: streaming_replica, dbname: postgres, sslmode: verify-full }
      sslKey: { name: hello-gke-replication, key: tls.key }
      sslCert: { name: hello-gke-replication, key: tls.crt }
      sslRootCert: { name: hello-gke-ca, key: ca.crt }
