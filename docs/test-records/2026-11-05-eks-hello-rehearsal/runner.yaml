# Rehearsal runner: the engine and the load writer run inside the cluster
# (like the platform), with rights only in namespace hello.
apiVersion: v1
kind: ServiceAccount
metadata: { name: hello-runner, namespace: hello }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: hello-runner, namespace: hello }
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [pods, services, secrets, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: hello-runner, namespace: hello }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: hello-runner }
subjects: [{ kind: ServiceAccount, name: hello-runner, namespace: hello }]
---
apiVersion: v1
kind: Pod
metadata: { name: hello-runner, namespace: hello, labels: { app: hello-runner } }
spec:
  serviceAccountName: hello-runner
  restartPolicy: Never
  containers:
    - name: runner
      image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
      imagePullPolicy: IfNotPresent
      command: [sleep, infinity]
      workingDir: /work
      env:
        - name: HELLO_PGPASSWORD
          valueFrom: { secretKeyRef: { name: hello-src-app, key: password } }
      resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumeMounts: [{ name: work, mountPath: /work }]
  volumes: [{ name: work, emptyDir: {} }]
