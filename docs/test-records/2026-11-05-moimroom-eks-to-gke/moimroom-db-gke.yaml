# Target standby on GKE. Streams from moimroom/moimroom-db on EKS through the
# Tailscale egress proxy db-eks (infra ADR 0048); the engine promotes it.
# Separate from the independent charlie-apps/moimroom-gcp-db, which stays as is.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: moimroom-db-gke, namespace: charlie-apps}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  smartShutdownTimeout: 5
  storage: {size: 1Gi, storageClass: standard-rwo}
  certificates:
    serverAltDNSNames: [db-gke.hopcharlie-db-network.svc.cluster.local]
  bootstrap:
    pg_basebackup: {source: moimroom-db, database: app, owner: app, secret: {name: moimroom-db-app}}
  replica: {self: moimroom-db-gke, primary: moimroom-db, source: moimroom-db}
  externalClusters:
    - name: moimroom-db
      connectionParameters: {host: db-eks.hopcharlie-db-network.svc.cluster.local, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: moimroom-db-replication, key: tls.key}
      sslCert: {name: moimroom-db-replication, key: tls.crt}
      sslRootCert: {name: moimroom-db-ca, key: ca.crt}
    - name: moimroom-db-gke
      connectionParameters: {host: moimroom-db-gke-rw.charlie-apps.svc, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: moimroom-db-gke-replication, key: tls.key}
      sslCert: {name: moimroom-db-gke-replication, key: tls.crt}
      sslRootCert: {name: moimroom-db-gke-ca, key: ca.crt}
