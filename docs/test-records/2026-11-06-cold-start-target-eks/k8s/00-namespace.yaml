# cold-mode (ADR 0012) e2e on the workload EKS. Everything lives here; delete the namespace to clean up.
apiVersion: v1
kind: Namespace
metadata: {name: cold-test, labels: {hopcharlie.dev/purpose: engine-e2e}}
---
# Test namespace only: keep ordinary traffic (DNS, API, CNPG, app) working whatever the cluster default is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cold-test-allow-all, namespace: cold-test}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{}]
  egress: [{}]
