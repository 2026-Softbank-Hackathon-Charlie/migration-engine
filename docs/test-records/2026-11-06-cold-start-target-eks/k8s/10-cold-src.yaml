apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: cold-src, namespace: cold-test}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  smartShutdownTimeout: 5
  storage: {size: 1Gi, storageClass: gp3}
  bootstrap:
    initdb: {database: app, owner: app}
  replica: {self: cold-src, primary: cold-src, source: cold-dst}
  externalClusters:
    - name: cold-src
      connectionParameters: {host: cold-src-rw.cold-test.svc, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: cold-src-replication, key: tls.key}
      sslCert: {name: cold-src-replication, key: tls.crt}
      sslRootCert: {name: cold-src-ca, key: ca.crt}
    - name: cold-dst
      connectionParameters: {host: cold-dst-rw.cold-test.svc, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: cold-dst-replication, key: tls.key}
      sslCert: {name: cold-dst-replication, key: tls.crt}
      sslRootCert: {name: cold-dst-ca, key: ca.crt}
