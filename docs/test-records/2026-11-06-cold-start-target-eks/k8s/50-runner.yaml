# Engine, gateway and load run here. Rights: this namespace only, no Secrets.
apiVersion: v1
kind: ServiceAccount
metadata: {name: cold-runner, namespace: cold-test}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cold-runner, namespace: cold-test}
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [pods, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cold-runner, namespace: cold-test}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cold-runner}
subjects: [{kind: ServiceAccount, name: cold-runner, namespace: cold-test}]
---
apiVersion: v1
kind: Pod
metadata: {name: cold-runner, namespace: cold-test}
spec:
  serviceAccountName: cold-runner
  restartPolicy: Never
  containers:
    - name: runner
      image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
      command: [sleep, infinity]
      workingDir: /work
      env:
        - name: PGPW
          valueFrom: {secretKeyRef: {name: cold-src-app, key: password}}
      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
      volumeMounts: [{name: work, mountPath: /work}]
  volumes: [{name: work, emptyDir: {}}]
