# Source (current primary) in the CNPG distributed topology.
# replica.primary == self  -> this cluster is the primary.
# replica.source points at the target so that, after demotion, it follows the new primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db-gke
  namespace: shop
spec:
  instances: 2
  # CNPG restarts a newly promoted primary in place with a smart shutdown, which
  # waits for every client session (app connection pools) up to this many seconds.
  # The default 180 would keep the new primary down for minutes after a switchover.
  smartShutdownTimeout: 5
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  replica:
    self: shop-db-gke
    primary: shop-db-gke
    source: shop-db-eks
  externalClusters:
    - name: shop-db-gke
      connectionParameters:
        host: shop-db-gke-rw.shop.gke.ts.net   # reachable over Tailscale
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey: { name: shop-db-gke-replication, key: tls.key }
      sslCert: { name: shop-db-gke-replication, key: tls.crt }
      sslRootCert: { name: shop-db-gke-ca, key: ca.crt }
    - name: shop-db-eks
      connectionParameters:
        host: shop-db-eks-rw.shop.eks.ts.net
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey: { name: shop-db-eks-replication, key: tls.key }
      sslCert: { name: shop-db-eks-replication, key: tls.crt }
      sslRootCert: { name: shop-db-eks-ca, key: ca.crt }
