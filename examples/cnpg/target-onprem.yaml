# Target standby on the on-prem k3s cluster, for moimroom EKS -> on-prem.
# Same shape as the production EKS -> GKE run of 2026-11-05
# (docs/test-records/2026-11-05-moimroom-eks-to-gke/moimroom-db-gke.yaml).
#
# Assumptions to check when the cluster exists (docs/onprem.md):
#   - the cluster and the namespace are reached as in infra apps.yaml
#     (cnpgCluster moimroom-db-onprem, namespace moimroom);
#   - each side reaches the other's database through a Tailscale operator
#     proxy, like db-eks / db-gke (infra ADR 0048). db-onprem is the name this
#     file assumes for the proxy in front of this cluster;
#   - the CNPG operator is 1.30.1, like EKS and GKE (hopmigrate envcheck).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: moimroom-db-onprem, namespace: moimroom}
spec:
  # One instance holds every write after cutover alone until the old source
  # has streamed it (the engine warns). Use 2 where the hardware allows.
  instances: 1
  # Same major and image as the source: physical replication (platform version gate).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  # The restart CNPG does right after promotion waits this long for client
  # sessions; writes are held meanwhile, so 1 second (ADR 0013).
  smartShutdownTimeout: 1
  storage:
    size: 1Gi
    storageClass: local-path   # k3s default provisioner
  certificates:
    # The source connects with sslmode=verify-full through the proxy name.
    serverAltDNSNames: [db-onprem.hopcharlie-db-network.svc.cluster.local]
  bootstrap:
    # Copy moimroom-db-app from EKS first, or CNPG makes a new app password and
    # changes it on promotion.
    pg_basebackup: {source: moimroom-db, database: app, owner: app, secret: {name: moimroom-db-app}}
  replica: {self: moimroom-db-onprem, primary: moimroom-db, source: moimroom-db}
  externalClusters:
    - name: moimroom-db
      connectionParameters: {host: db-eks.hopcharlie-db-network.svc.cluster.local, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: moimroom-db-replication, key: tls.key}
      sslCert: {name: moimroom-db-replication, key: tls.crt}
      sslRootCert: {name: moimroom-db-ca, key: ca.crt}
    - name: moimroom-db-onprem
      connectionParameters: {host: moimroom-db-onprem-rw.moimroom.svc, user: streaming_replica, dbname: postgres, sslmode: verify-full}
      sslKey: {name: moimroom-db-onprem-replication, key: tls.key}
      sslCert: {name: moimroom-db-onprem-replication, key: tls.crt}
      sslRootCert: {name: moimroom-db-onprem-ca, key: ca.crt}
