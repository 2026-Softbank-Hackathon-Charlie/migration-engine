# kind cluster for the gateway rehearsal. Host ports reach each Postgres; the
# apps, the gateway and the load run on the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hopgw
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30432, hostPort: 55552, listenAddress: "127.0.0.1" }
      - { containerPort: 30433, hostPort: 55553, listenAddress: "127.0.0.1" }
