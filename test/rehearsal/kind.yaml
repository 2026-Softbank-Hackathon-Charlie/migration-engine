# One local kind cluster for a CNPG rehearsal. Host ports reach each Postgres.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hop
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30432, hostPort: 55542, listenAddress: "127.0.0.1" }
      - { containerPort: 30433, hostPort: 55543, listenAddress: "127.0.0.1" }
